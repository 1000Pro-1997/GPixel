# 푸시·풀 리퀘스트마다 빌드하고 Core 테스트를 돌린다(Windows·macOS·Linux).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Gpixel.sln -c Release

      - name: Test
        run: dotnet test tests/Gpixel.Core.Tests -c Release --no-build

      # 홈페이지 HTML이 docs/i18n(틀·언어별 문구 표)과 앱 문구(resx)로 만든 그대로인지
      - name: Website pages up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet run --project tools/GuideShots -c Release -- --shortcuts docs/i18n/shortcuts.json
          git diff --exit-code docs/i18n/shortcuts.json
          python3 tools/build-docs.py --check

      # 온라인 에셋 카탈로그(docs/catalog)가 catalog/의 제출 패키지를 검사해 만든 그대로인지
      - name: Asset catalog up to date
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/CatalogBuilder -c Release -- --check
